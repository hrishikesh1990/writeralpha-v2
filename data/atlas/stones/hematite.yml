slug: hematite
name: Hematite
aka: [haematite, specular hematite, kidney ore]
kind: mineral
species: Hematite
family: iron oxide
formula: Fe2O3
crystal_system: trigonal
mohs: [5, 6.5]
colors: [silver-grey, black, gray, red-brown]
origins: [Brazil, Australia, China, Morocco, United Kingdom]
summary: >-
  A heavy iron oxide with a metallic shine and a red-brown streak. Natural
  hematite is only weakly magnetic; most strongly magnetic "hematite" is
  synthetic hematine. Keep it dry and away from salt, and handle it gently,
  since it is brittle.

safety:
  water:
    verdict: brief
    reason: Natural hematite is already iron oxide, but water can leave red-brown stains and dull the polish, and imitation hematine and metal findings can rust. Rinse quickly and dry.
  salt:
    verdict: avoid
    reason: Salt and brine draw moisture onto the surface, stain and corrode iron-bearing material and pit metal fittings. Use sound, smoke or moonlight.
  sun:
    verdict: safe
    reason: Hematite is opaque and does not fade. Sunlight is physically harmless.
  sleep:
    verdict: ok
    reason: Physically safe. Strongly magnetic pieces are probably hematine; keep those away from pacemakers and similar devices at night as well.
  wear:
    verdict: care
    reason: At Mohs 5 to 6.5 it is fairly hard but brittle. Beads and rings crack or shatter if dropped on tiles or knocked against hard surfaces.
  toxicity:
    level: none
    reason: Iron oxide is non-toxic in polished form. Dust from cutting or grinding is an irritant, so work it wet and avoid breathing the dust.
  elixir: indirect

tradition:
  chakras: [root]
  elements: [earth, fire]
  planets: [mars, saturn]
  vedic_planet: null
