slug: cherry-quartz
name: Cherry Quartz
aka: [cherry quartz glass, red quartz]
kind: glass
species: null
family: glass
formula: null
crystal_system: null
mohs: [5, 6]
colors: [red, cherry red, pink]
origins: [China]
summary: >-
  Despite the name, cherry quartz sold today is man-made glass with red
  streaks, not natural quartz. It is safe in water and stable in sunlight, but
  softer than real quartz, so it scratches more easily.

safety:
  water:
    verdict: safe
    reason: Glass is non-porous and does not dissolve, so rinsing is fine. Avoid hot water or sudden temperature changes, which can crack glass.
  salt:
    verdict: safe
    reason: Salt and salt water do not attack glass. Rinse afterwards; dry salt rubbed on the surface can dull a high polish over time.
  sun:
    verdict: safe
    reason: The colour is fused into the glass and does not fade. A clear sphere can still focus sunlight, so keep spheres off sunny sills.
  sleep:
    verdict: ok
    reason: Inert and smooth, so it is safe beside the bed or under a pillow.
  wear:
    verdict: care
    reason: At about Mohs 5 to 6 glass is scratched by ordinary dust and grit (which is quartz, Mohs 7). Store it apart from harder stones.
  toxicity:
    level: none
    reason: Finished glass is non-toxic to handle. The exact recipe is not disclosed, which is why an indirect elixir is recommended.
  elixir: indirect

