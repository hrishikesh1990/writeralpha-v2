slug: black-obsidian
name: Black Obsidian
aka: [volcanic glass, obsidian mirror, apache tear]
kind: mineraloid
species: null
family: volcanic glass
formula: null
crystal_system: amorphous
mohs: [5, 5.5]
colors: [black]
origins: [Mexico, United States, Armenia, Turkey, Iceland]
summary: >-
  Jet-black natural volcanic glass. Water, salt and sun do not harm it, but at
  Mohs 5 to 5.5 it scratches and chips, and broken edges are razor-sharp. Much
  cheap "black obsidian" jewellery is ordinary black glass, which is hard to tell
  apart.

safety:
  water:
    verdict: safe
    reason: Glass is non-porous and does not dissolve, so rinsing or soaking does not harm it. Avoid sudden hot-to-cold changes, which can crack glass.
  salt:
    verdict: safe
    reason: Salt and salt water do not attack glass, and salt crystals are too soft to scratch it. Use fine salt rather than gritty rock salt and rinse afterwards.
  sun:
    verdict: safe
    reason: The black comes from microscopic mineral particles and bubbles in the glass, which light does not fade. A black stone in strong sun gets hot but is not damaged.
  sleep:
    verdict: caution
    reason: Tumbled pieces are physically safe, but raw obsidian cuts. Tradition also calls black obsidian an intense stone and often advises against it under the pillow.
  wear:
    verdict: care
    reason: At Mohs 5 to 5.5 it scratches against harder stones and metal and chips if knocked. Bracelets dull fastest; pendants last longer.
  toxicity:
    level: none
    reason: Volcanic glass is inert and safe to handle. Sharp edges and dust from cutting or knapping are the only real hazards.
  elixir: indirect

