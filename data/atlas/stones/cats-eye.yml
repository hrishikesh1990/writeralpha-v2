slug: cats-eye
name: Cat's Eye
aka: [lehsunia, lahsuniya, vaidurya, chrysoberyl cat's eye, cymophane, cats eye stone]
kind: variety
species: Chrysoberyl
family: chrysoberyl
formula: BeAl2O4
crystal_system: orthorhombic
mohs: [8.5, 8.5]
colors: [honey yellow, greenish yellow, golden brown, green, gray]
origins: [Sri Lanka, India, Brazil, Madagascar, Tanzania]
summary: >-
  True cat's eye is chrysoberyl showing a sharp band of light from fine
  parallel inclusions; it is the Vedic Lehsunia, the Ketu stone. It is very hard
  and easy to care for. Much cheap "cat's eye" is fibre-optic glass.

safety:
  water:
    verdict: safe
    reason: Chrysoberyl is hard, non-porous and insoluble, so washing in warm soapy water is fine. Glass imitations are also water-safe.
  salt:
    verdict: safe
    reason: Salt cannot scratch or attack chrysoberyl at Mohs 8.5. Rinse afterwards and keep salt water off silver or panchdhatu settings, which can tarnish.
  sun:
    verdict: safe
    reason: Chrysoberyl's colour is stable and does not fade in sunlight. Avoid sudden extreme heat, which can crack any gem.
  sleep:
    verdict: ok
    reason: Physically inert and safe. Vedic tradition treats Lehsunia as a powerful stone and advises wearing it only after an astrologer's consultation.
  wear:
    verdict: daily
    reason: At Mohs 8.5 with good toughness it is one of the most durable jewellery stones and suits rings worn every day.
  toxicity:
    level: none
    reason: A very stable beryllium aluminium oxide that is safe to handle and wear. Beryllium-bearing dust from cutting should not be inhaled, so cutters work wet.
  elixir: indirect

tradition:
  chakras: [root, third_eye, crown]
  elements: [earth, fire]
  planets: []
  vedic_planet: ketu
