summary: >-
  Porous volcanic rock, usually vesicular basalt full of gas holes. The pores
  make it light and let it hold essential oils, which is why it is used in
  diffuser bracelets. They also trap water, sweat and salt, so rinse it only
  briefly, skip salt and let it dry fully.

safety:
  water:
    verdict: brief
    reason: Basalt does not dissolve, but the pores soak up water, stay damp, rot elastic cord and can grow mildew. Dyed beads may bleed. Rinse briefly and air-dry fully.
  salt:
    verdict: avoid
    reason: Salt water soaks deep into the pores and salt crystals grow there as it dries. Salt weathering can crumble the edges of beads and is almost impossible to rinse out.
  sun:
    verdict: safe
    reason: Natural black and grey lava does not fade. Coloured lava beads are dyed and can fade, and sun dries out any essential oil you have added.
  sleep:
    verdict: ok
    reason: Non-toxic and robust. The rough surface can snag fabric, and scented beads may disturb sleep for people sensitive to fragrance.
  wear:
    verdict: care
    reason: The rock is reasonably hard but the rough, porous surface absorbs sweat, oils and lotions and abrades softer beads and watch faces next to it.
  toxicity:
    level: none
    reason: Basalt is inert and safe to handle. Any hazard comes from what is added to it, such as undiluted essential oils.
  elixir: indirect

