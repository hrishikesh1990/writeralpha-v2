slug: moldavite
name: Moldavite
aka: [vltavin, tektite, bouteille stone]
kind: mineraloid
species: null
family: tektite
formula: null
crystal_system: amorphous
mohs: [5, 5.5]
colors: [green, olive green, bottle green, brownish green]
origins: [Czech Republic, Austria, Germany]
summary: >-
  A green natural glass formed about 15 million years ago when a meteorite
  impact in Bavaria melted local rock and threw it across Central Europe. It is
  earthly rock melted by an impact, not a meteorite. The market is flooded with
  green glass fakes; real moldavite has bubbles, swirls and often lechatelierite.

safety:
  water:
    verdict: safe
    reason: Moldavite is non-porous glass and does not dissolve or react with water, so rinsing is fine. Use room-temperature water and dry its deep pits well.
  salt:
    verdict: safe
    reason: Salt does not attack glass and salt crystals are too soft to scratch it. Salt lodges in the deep sculpted pits, so rinse thoroughly, and keep brine off silver or wire-wrapped settings.
  sun:
    verdict: safe
    reason: Its green comes from iron in the glass, which sunlight does not fade. Avoid fierce heat sources and sudden temperature changes, which can crack natural glass.
  sleep:
    verdict: caution
    reason: Physically safe on a nightstand. Crystal tradition calls moldavite one of the most intense stones and many users report vivid dreams or restlessness, so most keep it out of the bed.
  wear:
    verdict: care
    reason: At Mohs 5 to 5.5 and brittle, it scratches and chips easily. Pendants and earrings in protective settings last; rings and bracelets suffer.
  toxicity:
    level: none
    reason: Moldavite is silica-rich natural glass and safe to handle. Sharp fragments are the only physical hazard.
  elixir: indirect

