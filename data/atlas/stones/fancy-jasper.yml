mohs: [6.5, 7]
colors: [purple, green, red, cream, brown, yellow]
origins: [India]
summary: >-
  A trade name for multicoloured jasper from India, mottled in purple, olive
  green, red, cream and brown. Like all jasper it is an opaque microcrystalline
  quartz rock with natural mineral colours, so it is tough, sun-stable and fine
  in water. Skip salt soaks.

safety:
  water:
    verdict: safe
    reason: Jasper is dense microcrystalline quartz that does not dissolve, and its mineral colours do not wash out, so rinsing or a short soak is fine.
  salt:
    verdict: avoid
    reason: Jasper is slightly porous along grain boundaries and cracks. Salt crystallises there as brine dries, dulling the polish.
  sun:
    verdict: safe
    reason: Its colours come from iron and manganese oxides and green silicate minerals, which do not fade in sunlight.
  sleep:
    verdict: ok
    reason: Non-toxic and hard, so it is physically safe in the bedroom. Tradition calls it soothing.
  wear:
    verdict: daily
    reason: At Mohs 6.5 to 7 it is tough enough for daily bracelets, malas and rings.
  toxicity:
    level: none
    reason: Quartz with iron and manganese oxides is inert and safe to handle. Cutting it produces quartz dust, so lapidaries work it wet.
  elixir: indirect

