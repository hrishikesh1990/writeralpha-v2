slug: strawberry-quartz
name: Strawberry Quartz
aka: [red quartz, scarlet quartz]
kind: variety
species: Quartz
family: quartz
formula: SiO2
crystal_system: trigonal
mohs: [7, 7]
colors: [pink, red, strawberry red]
origins: [Kazakhstan, Mexico, Brazil, Madagascar, Morocco]
summary: >-
  Natural quartz speckled pink to red by tiny inclusions of iron oxides such as
  hematite and goethite. It is hard and safe in water, but much "strawberry
  quartz" on the market is red glass, so check what you have.

safety:
  water:
    verdict: safe
    reason: Quartz is non-porous and does not dissolve. The iron oxide flecks are sealed inside, so rinsing or soaking does no harm. Avoid hot water and steam.
  salt:
    verdict: safe
    reason: Salt does not attack quartz or the enclosed iron oxides. Rinse afterwards; skip salt for any piece you suspect is dyed.
  sun:
    verdict: limit
    reason: The red iron oxide flecks are light-stable, but pieces with a pink rose-quartz-like base, and dyed imitations, can fade. A few hours is fine; avoid a permanent sunny spot.
  sleep:
    verdict: ok
    reason: Non-toxic and safe under a pillow when tumbled.
  wear:
    verdict: daily
    reason: At Mohs 7 it handles everyday wear. Heavily included stones can be more prone to chipping on hard knocks.
  toxicity:
    level: none
    reason: Quartz with enclosed hematite or goethite. Iron oxides are non-toxic and sealed in the stone.
  elixir: direct

tradition:
  chakras: [heart]
  elements: [water, fire]
  planets: [venus]
  vedic_planet: null
  zodiac: [libra, taurus]
  intentions: [love, self-love, emotional-balance, luck, peace-calm]
  energy: calming
  birth_months: {}

cautions:
  - who: Anyone buying bright, even red or pink "strawberry quartz" cheaply
    why: The name is widely used for man-made red glass, also sold as cherry quartz. It is safe, but it is not natural quartz and should be priced as glass.
    basis: physical
  - who: People who leave crystals in sunny windows
    why: The iron oxide flecks are stable, but the pink base colour of some pieces and any dyed stones can fade over months of sun.
    basis: physical
  - who: People who wash crystals in very hot water
    why: Heavily included quartz can crack with sudden temperature changes. Use lukewarm water.
    basis: physical
  - who: People seeking a strongly energising stone
    why: Tradition treats strawberry quartz as a gentle, heart-centred stone rather than a stimulating one.
    basis: tradition

identify:
  common_fakes:
    - Red or pink glass (often sold as cherry quartz)
    - Dyed or crackled quartz
    - Pink resin or plastic beads
    - Red aventurine or pink-dyed quartzite
  tests:
    - id: magnification
      weight: 3
      how: Examine the stone with a 10x loupe in good light.
      real: Tiny red needles, dots or flakes scattered through the quartz, often with a slight sparkle; colour sits in the inclusions, not the background.
      fake: Red streaks or swirls in clear glass, round bubbles, and no individual inclusions.
    - id: color
      weight: 2
      how: Compare the stone against white paper in daylight.
      real: Patchy, speckled colour that varies across the stone.
      fake: Even, saturated candy red or pink with smooth flowing streaks.
    - id: hardness
      weight: 2
      how: On a tumbled piece, try to scratch a glass bottle.
      real: Quartz (Mohs 7) scratches glass easily.
      fake: Glass imitations only barely mark glass; resin is scratched itself.
    - id: temperature
      weight: 1
      how: Hold the stone to your cheek for ten seconds.
      real: Feels cold and warms slowly.
      fake: Glass and resin warm more quickly.
    - id: price
      weight: 1
      how: Compare the price with the size and colour.
      real: Natural strawberry quartz with good colour costs more than ordinary quartz.
      fake: Large, glowing red pieces at very low prices are almost always glass.

pairs:
  good:
    - slug: rose-quartz
      why: Two pink heart stones in tradition; both are quartz with the same care rules.
    - slug: clear-quartz
      why: Tradition says clear quartz amplifies strawberry quartz's warmth.
    - slug: rhodonite
      why: A traditional pairing for love and emotional healing.
    - slug: moonstone
      why: Paired in tradition for emotional balance and intuition in relationships.
    - slug: amethyst
      why: A calming pairing, and both are quartz that share cleansing methods.
  avoid: []

price:
  tier: budget
  note: Tumbled and small polished pieces are affordable. Clear stones with dense, bright red inclusions, especially from Kazakhstan or Mexico, cost more.

