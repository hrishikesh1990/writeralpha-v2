slug: sapphire
name: Sapphire
aka: [neelam, blue sapphire, pukhraj]
kind: variety
species: Corundum
family: corundum
formula: Al2O3
crystal_system: trigonal
mohs: [9, 9]
colors: [blue, yellow, pink, white, green, orange, purple]
origins: [Sri Lanka, Myanmar, Madagascar, Australia, Thailand, United States]
summary: >-
  Gem corundum in every colour except red, best known in blue. At Mohs 9 with
  no cleavage it is one of the most durable gems, safe in water and fine for
  daily wear. Lab-grown sapphire is real corundum; a lab report tells them
  apart.

safety:
  water:
    verdict: safe
    reason: Corundum does not absorb water. Warm soapy water is always safe; fracture-filled or dyed stones should only be wiped with a damp cloth.
  salt:
    verdict: safe
    reason: Salt does not harm corundum. Rinse afterwards to protect settings, and skip salt for any glass-filled stone.
  sun:
    verdict: safe
    reason: Sapphire colour is stable in daylight. Sunlight is physically harmless.
  sleep:
    verdict: ok
    reason: Physically safe. In Vedic custom a new blue sapphire is sometimes kept under the pillow for a few nights as a trial, which is tradition only.
  wear:
    verdict: daily
    reason: Mohs 9 with no cleavage makes sapphire excellent for rings. A very hard knock can still chip a corner.
  toxicity:
    level: none
    reason: Aluminium oxide is inert and non-toxic. Glass-filled stones should not go in drinking water.
  elixir: indirect

tradition:
  chakras: [throat, third_eye]
  elements: [water, air]
  planets: [saturn, jupiter]
  vedic_planet: shani
  zodiac: [virgo, libra, capricorn, aquarius, taurus]
  intentions: [intuition, concentration, communication, clarity, spiritual-growth, career]
  energy: balancing
  birth_months:
    modern: [september]
    traditional: [september]

cautions:
  - who: Owners of very cheap or unusually clear sapphires
    why: Some sapphires are filled with lead glass or coloured only on the surface by diffusion. Filled stones are damaged by lemon juice, cleaners, steam and torch heat.
    basis: physical
  - who: Buyers who need a natural or unheated stone
    why: Lab-grown sapphire is real corundum and looks identical at home. Heating is normal and widely accepted. Only a lab report confirms natural origin and treatment.
    basis: physical
  - who: Anyone considering blue sapphire for Vedic reasons
    why: In Jyotish, blue sapphire (Neelam) is the gem of Shani (Saturn) and is said to act fast and strongly. Astrologers usually insist on a chart reading, and many advise a trial period of a few days before wearing it permanently.
    basis: tradition
  - who: People wearing ruby (Manik) or red coral (Moonga)
    why: Vedic tradition treats the Sun and Mars as enemies of Saturn, so blue sapphire is traditionally never worn with ruby and usually not with red coral.
    basis: tradition
  - who: People confusing blue and yellow sapphire in Jyotish
    why: Yellow sapphire (Pukhraj) is a different Navaratna gem, belonging to Guru (Jupiter), with different recommended signs. Tradition treats the two as separate prescriptions.
    basis: tradition
zodiac_cautions:
  - sign: aries
    why: Aries is ruled by Mars, which Vedic astrology treats as an enemy of Saturn, so Neelam is usually not advised for Aries ascendants.
  - sign: scorpio
    why: Scorpio is also Mars-ruled, and the same Mars and Saturn enmity applies.
  - sign: leo
    why: Leo is ruled by the Sun, Saturn's traditional enemy, so blue sapphire is usually not advised for Leo ascendants.
  - sign: cancer
    why: Cancer is ruled by the Moon, treated as hostile to Saturn, so Vedic astrologers usually caution Cancer ascendants against Neelam.

identify:
  common_fakes:
    - Blue glass
    - Lab-grown (flame-fusion) sapphire sold as natural
    - Synthetic blue spinel
    - Iolite, kyanite or tanzanite sold as sapphire
    - Glass-filled or surface-diffused sapphire sold without disclosure
  tests:
    - id: magnification
      weight: 3
      how: Examine the stone with a 10x loupe in good light.
      real: Straight, angular colour bands, fine silk needles and natural crystal inclusions.
      fake: Curved growth lines and round bubbles suggest flame-fusion synthetic; bubbles alone suggest glass.
    - id: certificate
      weight: 3
      how: For a significant purchase or a Jyotish stone, ask for a report from a recognised gem lab.
      real: Report states natural sapphire, with or without heating.
      fake: Report states synthetic, glass filled or diffused, or no report is available.
    - id: color
      weight: 1
      how: Turn the stone and look through it from the top and the side.
      real: Blue sapphire shows a slightly different blue (greenish or violet) in different directions.
      fake: Glass and spinel look the same from every direction.
    - id: weight
      weight: 1
      how: Compare a loose stone with a glass stone of the same size.
      real: Sapphire feels heavy for its size (specific gravity about 4.0).
      fake: Glass (about 2.5) feels noticeably lighter.
    - id: uv
      weight: 1
      how: Shine a short- or long-wave UV torch on the stone in the dark.
      real: Most natural blue sapphire stays dark or glows weakly.
      fake: A chalky blue-white glow under short-wave UV can indicate synthetic or heat-treated material; not proof on its own.
    - id: price
      weight: 2
      how: Compare price with size and colour.
      real: Fine natural blue sapphire is expensive; even commercial grades cost well above glass.
      fake: A large, clean, intensely blue stone at a bargain price is likely synthetic, glass or filled.

pairs:
  good:
    - slug: diamond
      why: Venus is a friend of Saturn in Vedic astrology, so diamond and blue sapphire are a classic compatible pairing.
    - slug: emerald
      why: Mercury is a friend of Saturn in Jyotish, so emerald is traditionally compatible with Neelam.
    - slug: amethyst
      why: Amethyst (Jamunia) is the traditional affordable substitute for blue sapphire and shares its Saturn association.
    - slug: lapis-lazuli
      why: A blue Saturn substitute (Lajward) in Indian tradition and a matching throat-chakra stone in crystal practice.
    - slug: clear-quartz
      why: Tradition uses clear quartz to amplify sapphire's focus and clarity.
  avoid:
    - slug: ruby
      why: Blue sapphire (Saturn) and ruby (Sun) are the classic Vedic enmity pair and are traditionally never worn together.

price:
  tier: premium
  note: Commercial heated sapphire is moderately priced; fine unheated blue stones, and Kashmir or Burmese material, reach very high prices per carat.

