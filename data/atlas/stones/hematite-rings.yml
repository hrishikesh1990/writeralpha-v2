slug: hematite-rings
name: Hematite Rings
aka: [magnetic hematite ring, hematine ring, hemalyke ring]
kind: jewellery
species: Hematine (synthetic magnetic ferrite) or natural hematite
family: iron oxide
formula: null
crystal_system: null
mohs: [5.5, 6.5]
colors: [silver-grey, black, gold, rainbow]
origins: [China, Brazil]
summary: >-
  Band rings cut or moulded from shiny grey iron-oxide material. Most, and
  every strongly magnetic one, are synthetic hematine rather than natural
  hematite. They cannot be resized, snap rather than stretch, and should stay
  away from water, salt and implanted medical devices.

safety:
  water:
    verdict: brief
    reason: Quick contact with water is fine, but repeated wetting dulls the shine, can leave rust spots on hematine and wears plated colour finishes. Dry the ring after hand washing.
  salt:
    verdict: avoid
    reason: Salt water corrodes iron-oxide imitations and plated finishes and leaves stains. Take the ring off for the sea, pools and salt cleanses.
  sun:
    verdict: safe
    reason: Grey hematite and hematine do not fade. Sunlight is physically harmless to the ring.
  sleep:
    verdict: ok
    reason: Physically safe, but take the ring off if fingers swell at night, since it cannot stretch. Keep magnetic rings away from implanted devices while asleep.
  wear:
    verdict: care
    reason: Brittle rather than flexible. A knock against a door frame, weights or tiles can crack or snap the band into sharp pieces, and it cannot be resized.
  toxicity:
    level: low
    reason: Safe to wear. Natural hematite is inert; hematine is a ceramic ferrite whose exact composition varies by maker, so keep it out of drinks and food.
  elixir: never

