summary: >-
  An opaque rock of microcrystalline quartz coloured brick red by fine hematite.
  The colour is natural iron oxide, so it is sun-stable and fine in water. It is
  widely imitated with dyed howlite or magnesite, which are much softer, so a
  scratch test matters.

safety:
  water:
    verdict: safe
    reason: Jasper is dense microcrystalline quartz that does not dissolve, and its hematite colour does not wash out, so rinsing or a short soak is fine.
  salt:
    verdict: avoid
    reason: Jasper is slightly porous along grain boundaries and cracks. Salt crystallises there as brine dries, dulling the polish, and dyed imitations bleed.
  sun:
    verdict: safe
    reason: Hematite red is one of the most light-stable colours in nature and does not fade. Dyed howlite or magnesite sold as red jasper will fade.
  sleep:
    verdict: ok
    reason: Non-toxic and hard, so it is physically safe in the bedroom. Tradition calls it steady and grounding.
  wear:
    verdict: daily
    reason: At Mohs 6.5 to 7 it is tough and suits everyday bracelets and rings.
  toxicity:
    level: none
    reason: Quartz with hematite is inert and safe to handle. Cutting jasper produces quartz dust, so lapidaries work it wet.
  elixir: indirect

