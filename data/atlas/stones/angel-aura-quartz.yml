slug: angel-aura-quartz
name: Angel Aura Quartz
aka: [opal aura quartz, aura quartz, angel aura]
kind: treated
species: Quartz
family: quartz
formula: SiO2 (metal-coated)
crystal_system: trigonal
mohs: [7, 7]
colors: [white, iridescent, pastel rainbow, silver]
origins: [Brazil, United States, China]
summary: >-
  Natural clear quartz coated in a vacuum chamber with a nanometre-thin metal
  film, usually described as platinum and silver, which gives a pale rainbow
  sheen. The quartz is tough; the coating is the weak point, so no salt,
  abrasives or ultrasonic cleaners.

safety:
  water:
    verdict: brief
    reason: The quartz is water-safe, but long soaks and hard-water deposits dull the film. Rinse briefly in lukewarm water and pat dry without rubbing.
  salt:
    verdict: avoid
    reason: Salt grains scratch the metal film and salt water can tarnish the silver in it. Never use salt or salt water on aura quartz.
  sun:
    verdict: safe
    reason: The metal film does not fade in light. Keep pieces off hot surfaces, as repeated heating and cooling is the bigger risk to the bond.
  sleep:
    verdict: ok
    reason: Non-toxic and safe beside the bed. Points and clusters are sharp, and rubbing against bedding slowly wears the coating.
  wear:
    verdict: care
    reason: The quartz is Mohs 7 but the film is far softer and wears at edges and points. Avoid rings, keep it off other stones and remove it for washing or lotion.
  toxicity:
    level: none
    reason: The quartz and the bonded metal film are non-toxic to handle. Avoid direct elixirs because worn coating can flake into water.
  elixir: indirect

