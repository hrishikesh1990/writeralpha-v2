slug: pink-agate
name: Pink Agate
aka: [pink lace agate, pink botswana agate]
kind: variety
species: Quartz
family: chalcedony
formula: SiO2
crystal_system: trigonal
mohs: [6.5, 7]
colors: [pink, peach, white, grey]
origins: [Botswana, Brazil, China, Mexico]
summary: >-
  Agate with pink bands. Natural pink agate is a soft, dusty pink or peach, as in
  some Botswana agate. Most bright pink beads and slices are dyed chalcedony,
  and that dye fades in sunlight and can bleed in water. Treat any vivid pink as
  dyed.

safety:
  water:
    verdict: brief
    reason: The agate does not dissolve, but most pink agate is dyed and the dye can bleed in a long soak. A quick rinse and dry is safe for all pieces.
  salt:
    verdict: avoid
    reason: Agate is slightly porous. Brine soaks in, pulls dye out and leaves salt crystals in the pores and cracks as it dries.
  sun:
    verdict: avoid
    reason: Pink dyes in agate fade quickly in direct sun, often within weeks on a windowsill. Natural pink is more stable but still pale and easily washed out.
  sleep:
    verdict: ok
    reason: Non-toxic and hard, so it is physically safe in the bedroom.
  wear:
    verdict: care
    reason: The stone is hard (Mohs 6.5 to 7), but perfume, sweat, sunscreen and acetone can strip dye. Put jewellery on after cosmetics.
  toxicity:
    level: none
    reason: The agate is inert. The dyes are not food-safe, so do not use pink agate directly in drinking water.
  elixir: indirect

