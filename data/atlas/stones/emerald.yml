slug: emerald
name: Emerald
aka: [panna, green beryl]
kind: variety
species: Beryl
family: beryl
formula: Be3Al2Si6O18
crystal_system: hexagonal
mohs: [7.5, 8]
colors: [green, bluish green, yellowish green]
origins: [Colombia, Zambia, Brazil, Zimbabwe, Afghanistan, Ethiopia]
summary: >-
  The green, chromium- or vanadium-coloured variety of beryl. Hard but brittle
  and almost always oil- or resin-filled, so it needs a quick wash only: no
  ultrasonic, no steam, no hot water and no long soaks.

safety:
  water:
    verdict: brief
    reason: Nearly all emeralds have surface-reaching fractures filled with oil or resin. Lukewarm soapy water and a quick rinse are fine, but soaking or hot water can draw out the filler.
  salt:
    verdict: avoid
    reason: Salt and brine can work into filled fractures and leave residue, and salt water corrodes settings. Rinse in plain water instead.
  sun:
    verdict: limit
    reason: Emerald colour is stable, but heat from hot sun can dry oil fillings and make fractures show. Avoid hot windowsills and car dashboards.
  sleep:
    verdict: ok
    reason: Physically safe on a nightstand. Remove rings at night to avoid knocks against the bedframe.
  wear:
    verdict: care
    reason: Mohs 7.5 to 8 resists scratches, but inclusions make emerald brittle. Knocks, heat and chemicals such as cleaners and solvents can damage it.
  toxicity:
    level: none
    reason: Beryl is a stable silicate and safe to handle. Fillers are inert in normal wear.
  elixir: indirect

tradition:
  chakras: [heart]
  elements: [earth]
  planets: [venus, mercury]
  vedic_planet: budh
