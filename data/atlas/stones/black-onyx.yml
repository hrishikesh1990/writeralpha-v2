slug: black-onyx
name: Black Onyx
aka: [onyx, black chalcedony]
kind: variety
species: Quartz
family: chalcedony
formula: SiO2
crystal_system: trigonal
mohs: [6.5, 7]
colors: [black, black and white]
origins: [Brazil, Uruguay, India, China]
summary: >-
  Black chalcedony. True onyx is black-and-white banded agate, but almost all
  solid black onyx is grey chalcedony soaked in sugar and then acid, which turns
  it permanently black. This is centuries-old standard practice, not fraud. Hard,
  sun-stable and safe in water; avoid salt soaks.

safety:
  water:
    verdict: safe
    reason: Chalcedony does not dissolve and the carbon that makes it black is insoluble, so rinsing or a short soak is fine. Cheap surface-dyed beads may bleed.
  salt:
    verdict: avoid
    reason: Onyx is slightly porous. Brine soaks into the pores and leaves salt crystals behind as it dries, which dulls the polish and can open fine cracks.
  sun:
    verdict: safe
    reason: Carbon-blackened onyx does not fade in sunlight. A surface coating or organic dye can, which an acetone test shows.
  sleep:
    verdict: ok
    reason: Non-toxic and hard, so it is physically safe in the bedroom. Old European lore linked onyx with bad dreams, so some people keep it elsewhere.
  wear:
    verdict: daily
    reason: At Mohs 6.5 to 7 it is a durable ring and bead stone. Avoid sharp knocks, which can chip faceted edges.
  toxicity:
    level: none
    reason: The finished stone is inert silica coloured by carbon. The sugar and acid used in treatment are washed out, and the stone does not irritate skin.
  elixir: indirect

tradition:
  chakras: [root]
  elements: [earth]
  planets: [saturn, mars]
  vedic_planet: null
  zodiac: [capricorn, leo]
  intentions: [protection, grounding, confidence, courage, concentration, grief]
  energy: grounding
  birth_months: {}

cautions:
  - who: Anyone cleansing in salt water or a salt bowl
    why: Brine soaks into the slightly porous stone and crystallises in its pores and cracks, dulling the polish. Use plain water, smoke or sound.
    basis: physical
  - who: People with a nickel or metal allergy
    why: The onyx itself does not cause skin reactions. Rashes from onyx jewellery come from the metal, so choose nickel-free settings.
    basis: physical
  - who: Buyers who expect natural colour
    why: Solid black onyx is almost always treated chalcedony. The colour is permanent and the practice is standard, but naturally black onyx is rare.
    basis: physical
  - who: Families with small children or pets
    why: Onyx beads and small tumbled stones are a choking hazard. The stone is not toxic.
    basis: physical
  - who: Couples and light sleepers who follow older traditions
    why: Medieval European lore held that onyx brought melancholy, quarrels and bad dreams. Modern crystal tradition reverses this and calls it protective, but some still keep it out of the bedroom.
    basis: tradition
  - who: People seeking a bright, uplifting stone
    why: Tradition treats black onyx as a heavy, Saturn-like stone of discipline and boundaries rather than joy.
    basis: tradition

zodiac_cautions: []

identify:
  common_fakes:
    - Black glass
    - Black plastic or resin beads
    - Black obsidian sold as onyx
    - Dyed black howlite or other dyed stone
    - Black onyx marble (dyed calcite)
  tests:
    - id: hardness
      weight: 3
      how: On a hidden spot of a rough or tumbled piece, try to mark it with a steel knife. Do not test finished faceted jewellery.
      real: Steel does not mark onyx (Mohs 6.5 to 7).
      fake: Steel marks plastic, howlite and calcite easily, and leaves a faint line on some glass.
    - id: magnification
      weight: 3
      how: Examine the surface and drill holes with a 10x loupe.
      real: A smooth, slightly waxy polish and clean, shell-like chips around drill holes.
      fake: Round bubbles mean glass; mould lines or soft, stretched drill holes mean plastic.
    - id: acetone
      weight: 2
      how: Rub the drill hole with a cotton swab and nail-polish remover.
      real: Carbon-treated onyx leaves the swab clean.
      fake: Black on the swab means a surface dye or coating.
    - id: light
      weight: 1
      how: Shine a strong torch through a thin edge or drill hole.
      real: Often shows a very faint brown or reddish glow at thin edges.
      fake: Black glass may glow evenly greenish or brown; plastic shows no structure.
    - id: temperature
      weight: 1
      how: Hold the stone against your cheek for ten seconds.
      real: Feels cool and warms slowly.
      fake: Plastic warms almost immediately.
    - id: weight
      weight: 1
      how: Compare with a plastic bead of the same size.
      real: Feels solid and heavy for its size (specific gravity about 2.6).
      fake: Plastic and resin feel light.

pairs:
  good:
    - slug: black-tourmaline
      why: Two classic protection stones in tradition. Both are hard enough to store together.
    - slug: hematite
      why: A grounding pairing in tradition. Hematite must stay dry, so cleanse them separately.
    - slug: clear-quartz
      why: Tradition says clear quartz amplifies onyx's focus and resolve. Same care rules.
    - slug: smoky-quartz
      why: Both are grounding stones in tradition, often worn together.
    - slug: tiger-eye
      why: Tradition pairs onyx's discipline with tiger eye's confidence.
  avoid: []

price:
  tier: budget
  note: Black onyx beads, cabochons and rings are inexpensive because the treatment is cheap and reliable. Natural banded onyx and sardonyx suitable for cameos cost more.

names:
  es: Ónix negro

