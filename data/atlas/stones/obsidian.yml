slug: obsidian
name: Obsidian
aka: [volcanic glass, mahogany obsidian, rainbow obsidian, gold sheen obsidian]
kind: mineraloid
species: null
family: volcanic glass
formula: null
crystal_system: amorphous
mohs: [5, 5.5]
colors: [black, brown, mahogany, grey, green]
origins: [Mexico, United States, Armenia, Turkey, Iceland, Italy]
summary: >-
  Natural volcanic glass, formed when silica-rich lava cools too fast to
  crystallise. Water and salt do not harm it, but at Mohs 5 to 5.5 it scratches
  and chips, and broken edges are razor-sharp. Bright clear or neon "obsidian"
  is usually man-made glass.

safety:
  water:
    verdict: safe
    reason: Glass is non-porous and does not dissolve or react with water, so rinsing or soaking is fine. Avoid sudden hot-to-cold changes, which can crack glass.
  salt:
    verdict: safe
    reason: Salt and salt water do not attack glass, and salt crystals are too soft to scratch it. Grit in coarse rock salt can mark a polish, so use fine salt and rinse after.
  sun:
    verdict: safe
    reason: Obsidian's colour comes from tiny mineral particles and bubbles that sunlight does not fade. Black pieces get hot in strong sun but are not damaged.
  sleep:
    verdict: caution
    reason: Polished pieces are physically safe, but raw obsidian has edges sharp enough to cut skin. Tradition also calls it an intense stone and many advise against it under the pillow.
  wear:
    verdict: care
    reason: At Mohs 5 to 5.5 it scratches against quartz, metal and grit, and a hard knock chips it. Pendants and earrings last longer than rings and bracelets.
  toxicity:
    level: none
    reason: Volcanic glass is inert and safe to handle. The real hazard is physical, from sharp edges and from glass dust when cutting or knapping.
  elixir: indirect

tradition:
  chakras: [root]
  elements: [fire, earth]
  planets: [saturn, pluto]
  vedic_planet: null
