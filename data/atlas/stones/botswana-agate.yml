slug: botswana-agate
name: Botswana Agate
aka: [bobonong agate]
kind: variety
species: Quartz
family: chalcedony
formula: SiO2
crystal_system: trigonal
mohs: [6.5, 7]
colors: [grey, pink, peach, white, brown, black]
origins: [Botswana]
summary: >-
  A finely banded agate from eastern Botswana, known for tight, wavy bands in
  grey, pink, peach and white. Its colours are natural and stable, so it is one
  of the easier agates to care for: plain water and sun are fine, salt soaks are
  not.

safety:
  water:
    verdict: safe
    reason: Chalcedony does not dissolve, so rinsing or a short soak is fine. Dry it well, especially if it sits in a metal setting.
  salt:
    verdict: avoid
    reason: Agate is slightly porous. Brine soaks into the pores and leaves salt crystals behind as it dries, which dulls the polish and can open fine cracks.
  sun:
    verdict: safe
    reason: Its grey and pink banding comes from natural iron and the structure of the chalcedony, which sunlight does not fade. Dyed imitations are the exception.
  sleep:
    verdict: ok
    reason: Non-toxic and hard, so it is physically safe in the bedroom. Raw nodule halves can have rough edges.
  wear:
    verdict: daily
    reason: At Mohs 6.5 to 7 it takes everyday wear well and needs no special handling beyond avoiding hard knocks.
  toxicity:
    level: none
    reason: Silicon dioxide is inert and safe to handle. Cutting it makes silica dust, so lapidaries work it wet.
  elixir: indirect

tradition:
  chakras: [root, sacral, crown]
  elements: [fire]
  planets: []
  vedic_planet: null
